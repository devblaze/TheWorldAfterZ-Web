services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: twaz
      POSTGRES_DB: twaz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twaz -d twaz"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://twaz:${POSTGRES_PASSWORD}@db:5432/twaz?schema=public
      LAUNCHER_DIR: /launcher
      AUTH_URL: ${AUTH_URL:-https://theworldafterz.ncatechsolutions.org}
      AUTH_TRUST_HOST: "true"
      # Fail the deploy, not every login, when a secret is missing (Auth.js returns "server configuration" 500s).
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 32)}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?set DOWNLOAD_SIGNING_SECRET (openssl rand -base64 32)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-nikosantoniadis94@gmail.com}
    depends_on:
      db:
        condition: service_healthy
    # Defaults to host-only. On EasyDeploy, set APP_BIND to whatever its proxy needs (e.g. "3000").
    ports:
      - "${APP_BIND:-127.0.0.1:3000}:3000"
    volumes:
      - launcher:/launcher:ro

# Pinned so the network config never changes between deploys. Unpinned, EasyDeploy adds a subnet only when it creates
# the network, so the next deploy sees a changed config, recreates the network, and fails while Traefik is attached.
# 10.213.0.0/24 is the subnet EasyDeploy already gave prod's network; it is outside Docker's default pools.
networks:
  default:
    ipam:
      config:
        - subnet: 10.213.0.0/24

volumes:
  pgdata:
  launcher:
